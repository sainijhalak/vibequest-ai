services:
  - type: web
    name: vibequest-ai-api
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://vibequest-ai.vercel.app
      - key: ANTHROPIC_MODEL
        value: claude-3-7-sonnet-20250219
      - key: MOCK_AI
        value: false
      - key: ANTHROPIC_API_KEY
        sync: false
